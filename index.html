<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerritorIA · Lo que pasa aquí</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#2b1d3f;--plum2:#3d2a57;--mag:#c2457d;--mag2:#f3c4d8;--cream:#f6f1ea;--paper:#fffdf9;--ink:#221a2b;--ink2:#6b5f75;--line:#e6ddd3;
--t1:#6a4cd1;--t2:#1f8a66;--t3:#d0672b;--ok:#1f8a66}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito",system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,.serif{font-family:"Nunito",system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:0}
header{background:var(--plum);color:#efe8f3;padding:16px 5vw 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:700;color:#fff;margin-right:auto}
.brand span{color:var(--mag2);font-weight:600}
.badge{font-size:12px;font-weight:700;background:var(--mag2);color:var(--plum);border-radius:999px;padding:4px 12px}
.lang{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:#efe8f3;padding:5px 12px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:var(--plum)}
nav{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
nav button{font:inherit;font-size:15px;font-weight:500;border:0;background:none;color:#cbbfd6;padding:11px 16px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
nav button .n{display:inline-block;width:20px;height:20px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;line-height:20px;text-align:center;margin-right:6px}
nav button.on{background:var(--cream);color:var(--plum);font-weight:700}
nav button.on .n{background:var(--mag);color:#fff}
main{max-width:1120px;margin:0 auto;padding:40px 5vw 56px}
section.hide{display:none}
.kick{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mag);margin-bottom:10px}
h1{font-size:clamp(28px,3.8vw,44px);max-width:22ch;text-wrap:balance}
.sub{font-size:18px;color:var(--ink2);margin:14px 0 0;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;border-radius:999px;padding:7px 14px;background:#fff;border:1.5px solid var(--line);color:var(--plum)}
.chip svg{width:16px;height:16px}
.chip.ia{border-color:#d9cff7;color:#4a33a8;background:#f3effd}
/* flow */
.flow{display:grid;grid-template-columns:1fr 72px 220px 72px 1fr;column-gap:8px;align-items:center;margin-top:36px;position:relative}
.mom{grid-row:1;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding-bottom:14px}
.mom b{display:inline-block;background:var(--plum);color:#fff;border-radius:999px;padding:3px 10px;margin-right:6px;letter-spacing:.04em}
.mom.m2 b{background:var(--mag)}
.mom.m1{grid-column:1}.mom.m2{grid-column:3 / 6}
.flow>.tools,.flow>.arrow,.flow>.db,.flow>.out{grid-row:2}
.tools{display:flex;flex-direction:column;gap:12px}
.tl{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;border:1.5px solid var(--line)}
.tl .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.tl .ic svg{width:24px;height:24px}
.tl b{display:block;font-size:15px}.tl small{color:var(--ink2);font-size:13px}
.arrow{display:grid;place-items:center}
.arrow svg{width:48px;height:20px;display:block}
.db{aspect-ratio:1;width:220px;max-width:220px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--plum2),var(--plum) 70%);color:#fff;display:grid;place-items:center;text-align:center;padding:24px;border:6px solid #e9dff0;background-clip:padding-box}
.db svg{width:40px;height:40px;margin:0 auto 6px;display:block}
.db b{font-weight:800;font-size:20px;line-height:1.1;display:block}
.db small{font-size:12.5px;opacity:.8}
.out{background:#fff;border-radius:18px;padding:18px;border:1.5px solid var(--line)}
.out .h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:12px}
.out .h svg{width:22px;height:22px;color:var(--mag)}
.mini{display:flex;flex-direction:column;gap:7px}
.mini div{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:13px}
.mini i{display:block;height:10px;border-radius:999px;background:var(--mag)}
/* formar */
.tline{display:grid;grid-template-columns:repeat(4,1fr);margin-top:32px}
.st{text-align:center;position:relative;padding:0 12px}
.st:not(:last-child)::after{content:"";position:absolute;top:28px;left:calc(50% + 36px);right:calc(-50% + 36px);border-top:2px solid #c9b8d6}
.st .c{width:56px;height:56px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-weight:800;font-size:20px}
.st .w{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mag)}
.st b{display:block;font-size:18px;font-weight:800;margin:2px 0 6px}
.st .o{display:inline-block;font-size:14px;color:var(--plum);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;line-height:1.35}
.res{margin-top:32px;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:20px 24px}
.res h3{margin:0 0 14px;font-size:16px;font-weight:800;color:var(--plum)}
.res .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tchip{display:flex;gap:12px;align-items:center;border-radius:14px;padding:10px 12px;background:var(--cream)}
.tchip .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.tchip .ic svg{width:22px;height:22px}
.tchip b{display:block;font-size:15px}.tchip small{font-size:13px;color:var(--ink2)}
.ev{margin-top:24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;background:var(--plum);color:#fff;border-radius:20px;padding:18px 24px}
.ev .lbl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mag2);max-width:200px}
.ev .n{display:flex;align-items:baseline;gap:8px}
.ev .n b{font-size:36px;font-weight:800;line-height:1}.ev .n span{font-size:14px;opacity:.85;max-width:16ch;line-height:1.3}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.num{border-left:4px solid var(--mag);padding:4px 0 4px 16px}
.num b{font-size:44px;font-weight:800;line-height:1;color:var(--plum);display:block}
.num span{color:var(--ink2);font-size:14.5px}
/* usar */
.use{display:grid;grid-template-columns:320px 1fr;gap:40px;margin-top:32px;align-items:start}
.phone{background:#1b1424;border-radius:36px;padding:12px;box-shadow:0 18px 40px rgba(43,29,63,.25)}
.screen{background:#ece5dd;border-radius:26px;overflow:hidden;height:560px;display:flex;flex-direction:column}
.wa{background:#2b1d3f;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center}
.wa .av{width:34px;height:34px;border-radius:50%;background:var(--t1);display:grid;place-items:center}
.wa .av svg{width:18px;height:18px}
.wa b{font-size:14px;display:block}.wa small{font-size:11.5px;opacity:.75}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:7px}
.m{background:#fff;border-radius:10px 10px 10px 3px;padding:7px 10px;font-size:13.5px;max-width:88%;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.qr{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.qr span{background:#fff;border:1.5px solid #c9b8e6;color:#4a33a8;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.m.out{align-self:flex-end;background:#e9dcf6;border-radius:10px 10px 3px 10px}
.m .meta{font-size:11px;color:#8a7f92;margin-bottom:2px}
.tach{background:var(--plum);color:transparent;border-radius:3px;padding:0 3px;user-select:none}
.flag{font-size:11.5px;color:var(--mag);font-weight:700;margin-top:3px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps button{font:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--plum);border-radius:999px;padding:10px 18px;cursor:pointer}
.steps button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.panel{margin-top:22px}
.panel h2{font-size:28px;margin-bottom:6px}
.panel p{color:var(--ink2);margin:0 0 16px}
.q{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.q .k{flex:none;width:26px;height:26px;border-radius:50%;background:#f3effd;color:#4a33a8;font-weight:700;font-size:13px;display:grid;place-items:center}
.qcard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.qcard .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4a33a8;margin-bottom:8px}
.qcard .qq{font-size:18px;font-weight:700;margin-bottom:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts span{border:1.5px solid #d9cff7;color:#4a33a8;background:#f3effd;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.opts span.sel{background:#4a33a8;color:#fff;border-color:#4a33a8}
.qrest{font-size:14px;color:var(--ink2)}
.qrest div{padding:6px 0;border-bottom:1px solid var(--line)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px}
.rc b{display:block;font-size:40px;font-weight:800;line-height:1;color:var(--mag)}
.rc span{display:block;font-size:14.5px;margin:6px 0 8px;font-weight:600}
.rc span.law{display:inline-block;font-weight:700;font-size:12px;margin:0}
.bar .l{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:5px}
.bar .l b{font-size:20px;color:var(--plum)}
.bar .t{height:14px;border-radius:999px;background:#efe3ea;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--mag);border-radius:999px}
.law{display:inline-block;font-size:12px;font-weight:700;color:#7a1f4c;background:#fbe3ee;border-radius:999px;padding:2px 9px;margin-top:5px}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;background:var(--mag);color:#fff;border-radius:12px;padding:12px 18px;cursor:pointer;margin-top:18px}
/* conectar */
.fmt{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fmt span{font-family:ui-monospace,monospace;font-size:13px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--plum)}
.fmt.no span{background:#fbe3ee;border-color:#f3c4d8;color:#7a1f4c;text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}
.box{background:#fff;border-radius:20px;padding:22px;border:1.5px solid var(--line)}
.box h3{margin:0 0 4px;font-size:17px}
.heat{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:6px;margin-top:16px;font-size:14px}
.heat th{font-weight:700;color:var(--ink2);text-align:center;font-size:12.5px;padding:4px 6px;white-space:normal;line-height:1.25;vertical-align:bottom}.heat th:first-child{text-align:left;width:22%}
.heat td{border-radius:12px;padding:14px 6px;text-align:center;font-weight:800;font-size:15px}
.heat td.d{text-align:left;background:none;color:var(--plum)}
.heat td.x{background:repeating-linear-gradient(45deg,#f1ece6,#f1ece6 6px,#e6ddd3 6px,#e6ddd3 12px);color:transparent}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
footer{text-align:center;color:var(--ink2);font-size:13px;padding:0 5vw 32px}
@media(max-width:860px){
 .rgrid{grid-template-columns:1fr}.flow .db{width:200px}
 .flow{display:flex;flex-direction:column}.flow .arrow{transform:rotate(90deg);padding:10px 0}.mom.m1{order:1}.flow>.tools{order:2}.flow>.a1{order:3}.mom.m2{order:4;padding-top:6px}.flow>.db{order:5;max-width:200px}.flow>.arrow:not(.a1){order:6}.flow>.out{order:7}
 .tline{grid-template-columns:1fr 1fr;row-gap:24px}.st::after{display:none}.res .row{grid-template-columns:1fr}
 .nums,.two,.use{grid-template-columns:1fr}.phone{max-width:320px;margin:0 auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header>
 <div class="top">
  <div class="brand">TerritorIA <span>· Lo que pasa aquí</span></div>
  <div class="badge" data-i18n="badge"></div>
  <div class="lang"><button data-l="es" class="on">ES</button><button data-l="en">EN</button></div>
 </div>
 <nav id="nav">
  <button data-v="inicio" class="on" data-i18n="nav0"></button>
  <button data-v="formar"><span class="n">1</span><span data-i18n="nav1"></span></button>
  <button data-v="usar"><span class="n">2</span><span data-i18n="nav2"></span></button>
  <button data-v="conectar"><span class="n">3</span><span data-i18n="nav3"></span></button>
 </nav>
</header>
<main>
<section id="v-inicio">
 <div class="kick" data-i18n="k0"></div>
 <h1 data-i18n="h0"></h1>
 <p class="sub" data-i18n="s0"></p>
 <div class="flow">
  <div class="mom m1"><b data-i18n="m1"></b><span data-i18n="m1t"></span></div>
  <div class="mom m2"><b data-i18n="m2"></b><span data-i18n="m2t"></span></div>
  <div class="tools" id="tools0"></div>
  <div class="arrow a1"><svg viewBox="0 0 56 24"><path d="M2 12h46" stroke="#b9a6c8" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M44 5l8 7-8 7" fill="none" stroke="#b9a6c8" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <div class="db"><div><svg><use href="#i-db"/></svg><b data-i18n="db"></b><small data-i18n="dbs"></small></div></div>
  <div class="arrow"><svg viewBox="0 0 56 24"><path d="M2 12h46" stroke="#b9a6c8" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M44 5l8 7-8 7" fill="none" stroke="#b9a6c8" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <div class="out"><div class="h"><svg><use href="#i-health"/></svg><span data-i18n="out"></span></div><div class="mini" id="mini"></div></div>
 </div>
 <div class="chips" id="chips"></div>
</section>

<section id="v-formar" class="hide">
 <div class="kick" data-i18n="k1"></div>
 <h1 data-i18n="h1"></h1>
 <div class="tline" id="cycle"></div>
 <div class="res"><h3 data-i18n="resH"></h3><div class="row" id="cards"></div></div>
 <div class="ev" id="nums"></div>
</section>

 <h1 data-i18n="h2"></h1>
 <div class="use">
  <div class="phone"><div class="screen"><div class="wa"><div class="av"><svg><use href="#i-wa"/></svg></div><div><b>Voces de Río Alto</b><small data-i18n="waS"></small></div></div><div class="msgs" id="msgs"></div></div></div>
  <div>
   <div class="steps" id="steps"><button data-s="a" class="on" data-i18n="sa"></button><button data-s="b" data-i18n="sb"></button><button data-s="c" data-i18n="sc"></button></div>

  </div>
 </div>

 </div>

<script>
const T={es:{
badge:"Demo · datos ficticios",nav0:"Cómo funciona",nav1:"Formar",nav2:"Usar una herramienta",nav3:"Interconectar",

let L="es";try{L=localStorage.getItem("lpa-lang")||"es"}catch(e){}
let step="a";
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),t=k=>T[L][k];
const ic=(id,c)=>`<svg${c?` style="color:${c}"`:""}><use href="#i-${id}"/></svg>`;
const COL=["var(--t1)","var(--t2)","var(--t3)"],TIC=["wa","radio","paper"];
function render(){
 document.documentElement.lang=L;
 $$("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 $$(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 $("#tools0").innerHTML=t("tools").map((x,i)=>`<div class="tl"><div class="ic" style="background:${COL[i]}">${ic(TIC[i])}</div><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join("");
 $("#mini").innerHTML=[["Río Alto",58],["Quebrada Verde",61],["San Isidro",38],["Santa Rosa",36]].map(d=>`<div><span>${d[0]}</span><i style="width:${d[1]}%"></i></div>`).join("");
 $("#chips").innerHTML=[["lock","c1"],["spark","c2"],["five","c3"],["phone","c4"]].map(([i,k])=>`<span class="chip ${i==="spark"?"ia":""}">${ic(i)}${t(k)}</span>`).join("");
 $("#cycle").innerHTML=t("cy").map((c,i)=>`<div class="st"><div class="c">${i+1}</div><div class="w">${t("wk")} ${i+1}</div><b>${c[0]}</b><span class="o">${c[1]}</span></div>`).join("");
 $("#cards").innerHTML=t("tools").map((x,i)=>`<div class="tchip"><div class="ic" style="background:${COL[i]}">${ic(TIC[i])}</div><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join("");
 $("#nums").innerHTML=`<div class="lbl">${t("evL")}</div>`+t("nums").map(n=>`<div class="n"><b>${n[0]}</b><span>${n[1]}</span></div>`).join("");
 const tach=s=>`<span class="tach">${s}</span>`;
 const M=t("M"),fl=[0,0,1,0,1,0];
 $("#msgs").innerHTML=`<div class="m out">${t("qMsg")}</div><div class="qr">${t("opts").map(o=>`<span>${o}</span>`).join("")}</div>`+M.map((m,i)=>`<div class="m"><div class="meta">#${i+1}</div>${m.replace("{n}",tach("Rosa Pérez")).replace("{t}",tach("987 654 321")).replace("{p}",tach("la chacra de los Huamán"))}${fl[i]?`<div class="flag">● ${t("hid")}</div>`:""}</div>`).join("");
 $("#kpis").innerHTML=t("K").map(n=>`<div class="num"><b>${n[0]}</b><span>${n[1]}</span></div>`).join("");
 $("#fmt").innerHTML=t("F").map(f=>`<span>${f}</span>`).join("");
 $("#nofmt").innerHTML=t("N").map(f=>`<span>${f}</span>`).join("");
 const D=[["Río Alto",[58,40,63,75]],["Quebrada Verde",[61,53,43,75]],["San Isidro",[38,36,33,45]],["Santa Rosa",[36,null,33,67]],["Nuevo Edén",[29,27,null,null]]];
 const col=v=>v===null?"":v>=55?"background:#c2457d;color:#fff":v>=40?"background:#e99bbd;color:#3a1028":"background:#f8dbe7;color:#7a1f4c";
 $("#heat").innerHTML=`<tr>${t("TH").map(h=>`<th>${h}</th>`).join("")}</tr>`+D.map(([d,v])=>`<tr><td class="d">${d}</td>${v.map(x=>x===null?`<td class="x">.</td>`:`<td style="${col(x)}">${x} %</td>`).join("")}</tr>`).join("");
 const lg=t("lg");$("#legend").innerHTML=`<span><i style="background:#f8dbe7"></i>${lg[0]}</span><span><i style="background:#e99bbd"></i>${lg[1]}</span><span><i style="background:#c2457d"></i>${lg[2]}</span><span><i style="background:repeating-linear-gradient(45deg,#f1ece6,#f1ece6 3px,#e6ddd3 3px,#e6ddd3 6px)"></i>${lg[3]}</span>`;
 panel();
}
function panel(){
 $$("#steps button").forEach(b=>b.classList.toggle("on",b.dataset.s===step));
 const p=$("#panel");
 if(step==="a"){const Q=t("Q");p.innerHTML=`<h2>${t("pa")}</h2><p>${t("qInfo")}</p><div class="qcard"><div class="lab">${t("qLab")}</div><div class="qq">${Q[0]}</div><div class="opts">${t("opts").map((o,i)=>`<span class="${i===2?"sel":""}">${o}</span>`).join("")}</div></div><div class="qrest">${Q.slice(1).map((q,i)=>`<div>${i+2}. ${q}</div>`).join("")}</div><span class="chip ia" style="margin-top:14px">${ic("spark")}${t("c2")}</span>`}
 else if(step==="b")p.innerHTML=`<h2>${t("pb")}</h2><p>${t("pbT")}</p><span class="chip">${ic("lock")}${t("c1")}</span>`;
 else p.innerHTML=`<h2>${t("pc")}</h2><div class="rgrid">`+t("R").map(r=>`<div class="rc"><b>${r[1]} %</b><span>${r[0]}</span><span class="law">${r[2]?(L==="es"?"Ley 30364 · ":"Law 30364 · ")+r[2]:t("access")}</span></div>`).join("")+`</div><button class="btn" onclick="ver('conectar')">${t("go3")} →</button>`;
}
function ver(v){$$("main>section").forEach(s=>s.classList.toggle("hide",s.id!=="v-"+v));$$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));window.scrollTo(0,0);if(location.hash!=="#"+v)history.replaceState(null,"","#"+v)}
$$("#nav button").forEach(b=>b.onclick=()=>ver(b.dataset.v));
$$("#steps button").forEach(b=>b.onclick=()=>{step=b.dataset.s;panel()});
$$(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("lpa-lang",L)}catch(e){}render()});
const vh=()=>["formar","usar","conectar"].includes(location.hash.slice(1))?location.hash.slice(1):"inicio";
window.addEventListener("hashchange",()=>ver(vh()));
render();ver(vh());
</script>
